<!DOCTYPE html>
<html>
<head>
  <title>Escanear QR com jsQR</title>
  <link rel="stylesheet" href="/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #video-container {
      position: relative;
      width: 100%;
      max-width: 400px;
    }
    video, canvas {
      width: 100%;
      border-radius: 10px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    #message {
      margin-top: 1rem;
      font-weight: bold;
    }
    #message.success { color: #28a745; }
    #message.error { color: #dc3545; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <h1>Escanear QR com jsQR</h1>
  <nav><a href="index.html">Início</a></nav>

  <div id="video-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="message">Aponte a câmera para o QR code...</div>

  <script type="module">

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const message = document.getElementById('message');

    // create a hidden canvas to grab video frames
    const hiddenCanvas = document.createElement('canvas');
    const hiddenCtx = hiddenCanvas.getContext('2d');

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;

      video.addEventListener('loadedmetadata', () => {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        hiddenCanvas.width = video.videoWidth;
        hiddenCanvas.height = video.videoHeight;
        requestAnimationFrame(tick);
      });
    }

    async function tick() {
      hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
      const imageData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);

      const code = jsQR(imageData.data, imageData.width, imageData.height);
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (code) {
        // draw bounding box
        ctx.strokeStyle = 'lime';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(code.location.topLeftCorner.x, code.location.topLeftCorner.y);
        ctx.lineTo(code.location.topRightCorner.x, code.location.topRightCorner.y);
        ctx.lineTo(code.location.bottomRightCorner.x, code.location.bottomRightCorner.y);
        ctx.lineTo(code.location.bottomLeftCorner.x, code.location.bottomLeftCorner.y);
        ctx.closePath();
        ctx.stroke();

        // send to API once detected
        message.textContent = 'QR Code detectado! Enviando...';
        fetch('/api/upload-qr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qr_data: code.data })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success && data.purchase_id) {
            message.innerHTML = `
              Nota processada com sucesso!<br>
              <a href="/purchase.html?id=${data.purchase_id}">
                Ver compra #${data.purchase_id}
              </a>
            `;
            message.className = 'success';
          } else {
            message.textContent = data.error || 'Erro ao processar QR.';
            message.className = 'error';
          }
        })
        .catch(() => {
          message.textContent = 'Erro ao conectar ao servidor.';
          message.className = 'error';
        });
      } else {
        message.textContent = 'Aponte a câmera para o QR code...';
        message.className = '';
      }

      requestAnimationFrame(tick);
    }

    startCamera();
  </script>

</body>
</html>
