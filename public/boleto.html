<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Escanear Boleto</title>

  <style>
    /* Page basics */
    :root {
      --gap: 12px;
      --max-width: 900px;
    }
    html,body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #fff;
      color: #111;
      -webkit-font-smoothing:antialiased;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--gap);
      box-sizing: border-box;
    }

    h2 { margin: 0 0 var(--gap); font-size: 1.15rem; }

    #status {
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* Video container: responsive, capped height on mobile so it can't blow out page */
    #video {
      position: relative;            /* for absolutely positioned children */
      width: 100%;
      max-width: 720px;
      margin: 0 auto 12px;
      border-radius: 8px;
      overflow: hidden;              /* clip video and canvases */
      background: #000;
      /* aspect-ratio keeps a sane box without layout jumps.
         boleto is usually scanned portrait, so 9/16 is a good starting ratio.
         If you prefer landscape, use 16/9 */
      aspect-ratio: 9 / 16;
      /* ensure it never gets taller than viewport on mobile */
      max-height: 80vh;
    }

    /* Make any video/canvas injected by Quagga fill the container and not affect layout */
    #video video,
    #video canvas {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      inset: 0;
      object-fit: cover; /* cover so camera fills the box, cropping where necessary */
      transform: none !important;
    }

    /* Output area */
    pre#output {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f6f6f7;
      padding: 10px;
      border-radius: 6px;
      margin: 0;
      font-size: .9rem;
      max-height: 28vh;
      overflow: auto;
    }

    /* Small screens adjustments */
    @media (max-width:420px){
      :root { --gap: 10px; }
      #video { aspect-ratio: 9/16; max-height: 72vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Boleto Scanner (Resilient)</h2>
    <div id="status">Initializing...</div>

    <!-- target for Quagga -->
    <div id="video" aria-label="camera view"></div>

    <pre id="output">Waiting for code...</pre>
  </div>

  <!-- script runs after DOM loaded -->
  <script type="module">
    import Quagga from "https://cdn.jsdelivr.net/npm/@ericblade/quagga2/+esm";

    const videoContainer = document.getElementById('video');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    let recentCodes = [];
    let stableCode = null;

    // initialize Quagga
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: videoContainer,
        constraints: {
          /* mobile devices will pick a camera resolution; prefer a reasonable ideal */
          width: { ideal: 720 },
          height: { ideal: 1280 },
          facingMode: "environment"
        }
      },
      decoder: {
        readers: [
          "code_128_reader",
          "i2of5_reader",
          "code_39_reader",
          "ean_reader"
        ],
        multiple: false
      },
      locator: {
        patchSize: "medium",
        halfSample: true
      },
      frequency: 5,
      locate: true,
    }, err => {
      if (err) {
        console.error(err);
        status.textContent = "Erro ao inicializar camera.";
        return;
      }
      Quagga.start();
      status.textContent = "Escaneando...";
    });

    Quagga.onProcessed(result => {
      // defensive: check canvas exists
      const canvas = Quagga.canvas && Quagga.canvas.dom && Quagga.canvas.dom.overlay;
      const ctx = Quagga.canvas && Quagga.canvas.ctx && Quagga.canvas.ctx.overlay;
      if (!canvas || !ctx) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (result && result.boxes) {
        result.boxes.filter(b => b !== result.box)
          .forEach(box => {
            Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, ctx, { color: "green", lineWidth: 2 });
          });
      }
    });

    Quagga.onDetected(async result => {
      if (!result || !result.codeResult || !result.codeResult.code) return;
      const code = result.codeResult.code.replace(/\s/g, '');
      if (code.length !== 44) {
        // optional: show short-read feedback briefly
        status.textContent = "Quase lá...";
        setTimeout(()=> status.textContent = "Escaneando...", 800);
        return; // ignore short reads
      }

      status.textContent = "Detectado um boleto!";
      let data = {}
      try {
        const res = await fetch("/api/boleto", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        if (!res.ok) {
          status.textContent = `Erro no servidor: ${res.status}`;
          console.error("Servidor retornou", res.status);
          return;
        }
        data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        console.error(err);
        status.textContent = "Erro de internet.";
      } finally {
        if (data.boleto.success) {
            Quagga.stop();
        } else {
            status.textContent = "Erro lendo código de barras, tentar novamente"
        }
      }
    });
  </script>
</body>
</html>
