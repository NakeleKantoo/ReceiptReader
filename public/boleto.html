<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanear Boleto</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module">
    import Quagga from "https://cdn.jsdelivr.net/npm/@ericblade/quagga2/+esm";

    const videoContainer = document.getElementById('video');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    let recentCodes = [];
    let stableCode = null;

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: videoContainer,
        constraints: {
          width: { ideal: 720 },
          height: { ideal: 1280 },
          facingMode: "environment"
        }
      },
      decoder: {
        readers: [
          "code_128_reader",
          "i2of5_reader",
          "code_39_reader",
          "ean_reader"
        ],
        multiple: false
      },
      locator: {
        patchSize: "medium",
        halfSample: true
      },
      frequency: 5,
      locate: true,
    }, err => {
      if (err) {
        console.error(err);
        status.textContent = "Error starting camera.";
        return;
      }
      Quagga.start();
      status.textContent = "Scanning...";
    });

    Quagga.onProcessed(result => {
      const ctx = Quagga.canvas.ctx.overlay;
      const canvas = Quagga.canvas.dom.overlay;
      if (result && result.boxes) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        result.boxes.filter(b => b !== result.box)
          .forEach(box => {
            Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, ctx, { color: "green", lineWidth: 2 });
          });
      }
    });

    Quagga.onDetected(async result => {
      const code = result.codeResult.code.replace(/\s/g, '');
      if (code.length !== 44) return; // ignore short reads
        status.textContent = "✅ Stable code detected!";
        const res = await fetch("/api/boleto", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();

        output.textContent = JSON.stringify(data, null, 2);
        Quagga.stop();
    });
  </script>
</head>
<body>
  <h2>Boleto Scanner (Resilient)</h2>
  <div id="status">Initializing...</div>
  <div id="video"></div>
  <pre id="output">Waiting for code...</pre>
</body>
</html>
