<!DOCTYPE html>
<html>
<head>
  <title>Compras</title>
  <link rel="stylesheet" href="/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Compras</h1>
  <nav><a href="index.html">Início</a></nav>

    <div class="filter-bar">
      <label>De: <input type="date" id="filterDateFrom" /></label>
      <label>Até: <input type="date" id="filterDateTo" /></label>
      <div class="flex">
        <button type="button" id="preset7days">Últimos 7 dias</button>
        <button type="button" id="preset30days">Últimos 30 dias</button>
        <button type="button" id="presetMonth">Último mês</button>
      </div>
      <input type="text" id="filterName" placeholder="Nome do item" />
      <input type="text" id="filterSupermarket" placeholder="Supermercado" />
      <select id="filterPayment">
        <option value="">Forma de pagamento</option>
      </select>
      <button id="filterBtn">Filtrar</button>
      <button id="clearBtn" style="background-color: #999;">Limpar</button>
    </div>

  <h2>Compras</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Supermercado</th>
        <th>Forma de pagamento</th>
        <th>Total</th>
        <th>Produtos</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody id="purchaseTable"></tbody>
  </table>

  <script>

    async function loadPayments() {
      const res = await fetch("/api/payment_methods");
      const payments = await res.json();
      const select = document.getElementById("filterPayment");
      select.innerHTML = `<option value="">Forma de Pagamento</option>`;
      payments.forEach(p => {
        select.innerHTML += `<option value="${p.method}">${p.method}</option>`;
      });
    }

    function formatDateTime(iso) {
  const d = new Date(iso);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
  const year = d.getFullYear();
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  const seconds = String(d.getSeconds()).padStart(2, '0');
  return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
}

    async function loadPurchases(filters = {}) {
      const params = new URLSearchParams(filters);
      const res = await fetch("/api/purchases/filter?" + params.toString());
      const purchases = await res.json();
      const tbody = document.getElementById("purchaseTable");
      tbody.innerHTML = "";
      purchases.forEach(p => {//<td>${p.address}</td>
        const prettyDate = formatDateTime(p.date)
        tbody.innerHTML += `<tr>
          <td class="tdId" data-label="ID">${p.id}</td>
          <td data-label="Supermercado">${p.supermarketpn??p.supermarket}</td>
          <td data-label="Forma de pagamento">${p.payment_method}</td>
          <td data-label="Total">R$${p.total}</td>
          <td data-label="Ver mais"><a href="purchase.html?id=${p.id}">Detalhes</a></td>
          <td data-label="Data">${prettyDate}</td>
        </tr>`;
      });
    }


  document.getElementById("filterBtn").onclick = () => {
    const filters = {};
    const from = document.getElementById("filterDateFrom").value;
    const to = document.getElementById("filterDateTo").value;
    const name = document.getElementById("filterName").value;
    const supermarket = document.getElementById("filterSupermarket").value;
    const payment = document.getElementById("filterPayment").value;

    if (from) filters.from = from;
    if (to) filters.to = to;
    if (name) filters.name = name;
    if (supermarket) filters.supermarket = supermarket;
    if (payment) filters.payment_method = payment;

    loadPurchases(filters);
  };

  document.getElementById("clearBtn").onclick = () => {
    document.querySelectorAll(".filter-bar input, .filter-bar select").forEach(el => el.value = "");
    loadPurchases();
  };
  document.getElementById("preset7days").onclick = () => {
  const today = new Date();
  const from = new Date();
  from.setDate(today.getDate() - 6); // last 7 days includes today
  document.getElementById("filterDateFrom").value = formatDate(from);
  document.getElementById("filterDateTo").value = formatDate(today);
};

document.getElementById("preset30days").onclick = () => {
  const today = new Date();
  const from = new Date();
  from.setDate(today.getDate() - 29); // last 30 days
  document.getElementById("filterDateFrom").value = formatDate(from);
  document.getElementById("filterDateTo").value = formatDate(today);
};

document.getElementById("presetMonth").onclick = () => {
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth() - 1, 1); // first day of last month
  const end = new Date(today.getFullYear(), today.getMonth(), 0);       // last day of last month
  document.getElementById("filterDateFrom").value = formatDate(start);
  document.getElementById("filterDateTo").value = formatDate(end);
};

function formatDate(date) {
  const yyyy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

    // Initial load
    
    loadPayments();
    loadPurchases();
    
  </script>
</body>
</html>
