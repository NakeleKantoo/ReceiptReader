<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Detalhes da compra</title>
</head>
<body>
  <h1>Detalhes da compra</h1>

  <div id="purchaseInfo"></div>

  <h2>Produtos</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço Unit.</th>
        <th>Preço Total</th>
      </tr>
    </thead>
    <tbody id="itemsTable"></tbody>
  </table>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function formatDate(dateStr) {
      // database is "YYYY-MM-DD HH:mm", we want "DD/MM/YYYY HH:mm"
      const d = new Date(dateStr.replace(" ", "T")); 
      return d.toLocaleString("pt-BR", { hour12: false });
    }

    async function loadPurchase() {
      const id = getQueryParam("id");
      if (!id) {
        document.body.innerHTML = "<h2>No purchase ID provided</h2>";
        return;
      }

      const res = await fetch(`/api/purchases/${id}`);
      if (!res.ok) {
        document.body.innerHTML = "<h2>Purchase not found</h2>";
        return;
      }
      const purchase = await res.json();

      document.getElementById("purchaseInfo").innerHTML = `
        <p><b>Supermercado:</b> ${purchase.supermarket_pretty || purchase.supermarket_name}</p>
        <p><b>Endereço:</b> ${purchase.location_address}</p>
        <p><b>Total:</b> R$${purchase.total}</p>
        <p><b>Forma de Pagamento:</b> ${purchase.payment_method}</p>
        <p><b>Data:</b> ${formatDate(purchase.date)}</p>
      `;

      const tbody = document.getElementById("itemsTable");
      tbody.innerHTML = "";

      purchase.items.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.item_name}</td>
          <td>${item.quantity} ${item.unit}</td>
          <td>R$ ${(item.price/item.quantity).toFixed(2)}</td>
          <td>R$ ${item.price.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadPurchase();
  </script>
</body>
</html>
