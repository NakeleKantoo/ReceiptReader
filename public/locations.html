<!DOCTYPE html>
<html>
  <head><title>Endereços</title></head>
  <body>
    <h1>Endereços</h1>
    <nav><a href="index.html">Início</a></nav>
    <form id="locForm">
      <input type="number" id="superId" placeholder="ID do supermercado" required />
      <input type="text" id="address" placeholder="Endereço" />
      <button type="submit">Adicionar Endereço</button>
    </form>
    <h2>Endereços</h2>
    <table border="1">
      <thead><tr><th>ID</th><th>Supermercado</th><th>Endereço</th></tr></thead>
      <tbody id="locTable"></tbody>
    </table>
    <script>
      async function loadLocations() {
        const res = await fetch("/api/locations");
        const data = await res.json();
        const tbody = document.getElementById("locTable");
        tbody.innerHTML = "";
        data.forEach(l => {
          tbody.innerHTML += `<tr><td>${l.id}</td><td>${l.supermarketpn??l.supermarket}</td><td>${l.address || ""}</td></tr>`;
        });
      }
      document.getElementById("locForm").onsubmit = async e => {
        e.preventDefault();
        const supermarket_id = +document.getElementById("superId").value;
        const address = document.getElementById("address").value;
        await fetch("/api/locations", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ supermarket_id, address })
        });
        e.target.reset();
        loadLocations();
      };
      loadLocations();
    </script>
  </body>
</html>
