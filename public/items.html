<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <link rel="stylesheet" href="/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Produtos</h1>
  <nav><a href="index.html">Início</a></nav>
  <form id="itemForm">
    <label>Nome: <input type="text" name="name" required></label><br>
    <button type="submit">Criar produto</button>
  </form>

  <h2>Produtos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="itemsTable"></tbody>
  </table>

  <script>
    async function loadItems() {
      const res = await fetch("/api/items");
      const items = await res.json();
      const tbody = document.getElementById("itemsTable");
      tbody.innerHTML = "";

      items.forEach(item => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td data-label="ID" class="tdId">${item.id}</td>
          <td data-label="Nome">
            <input type="text" value="${item.name}" data-id="${item.id}">
          </td>
          <td data-label="Ações">
            <button onclick="updateItem(${item.id})">Atualizar</button>
            <button onclick="deleteItem(${item.id})">Deletar</button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    async function updateItem(id) {
      const input = document.querySelector(`input[data-id='${id}']`);
      const newName = input.value;

      await fetch(`/api/items/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: newName })
      });

      loadItems();
    }

    async function deleteItem(id) {
      await fetch(`/api/items/${id}`, { method: "DELETE" });
      loadItems();
    }

    document.getElementById("itemForm").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());

      await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      form.reset();
      loadItems();
    });

    loadItems();
  </script>
</body>
</html>
