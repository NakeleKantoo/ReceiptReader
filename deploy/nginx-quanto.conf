# nginx — reverse proxy do Quanto
#
#   sudo cp deploy/nginx-quanto.conf /etc/nginx/sites-available/quanto
#   sudo ln -s /etc/nginx/sites-available/quanto /etc/nginx/sites-enabled/quanto
#   sudo certbot --nginx -d quanto.leonnaviegas.dev.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# O bloco de TLS abaixo é o que o certbot escreve; se você usa outro método,
# mantenha apenas o server :80 -> :443 e o proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name quanto.leonnaviegas.dev.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name quanto.leonnaviegas.dev.br;

    ssl_certificate     /etc/letsencrypt/live/quanto.leonnaviegas.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quanto.leonnaviegas.dev.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
