services:
  quanto:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: quanto
    restart: unless-stopped
    ports:
      # o reverse proxy (nginx/caddy) fala com 127.0.0.1:3030
      - "3030:3030"
    environment:
      NODE_ENV: production
      PORT: "3030"
      DATABASE_PATH: /data/quanto.db
      PUBLIC_URL: https://quanto.leonnaviegas.dev.br
      SESSION_TTL_DAYS: "90"
      INVITE_TTL_HOURS: "24"
      MAX_MEMBERS: "5"
      TRUST_PROXY: "1"
    volumes:
      # crie antes: mkdir -p data && chown 1000:1000 data
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
